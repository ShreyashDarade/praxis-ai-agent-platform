services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: praxis
      POSTGRES_PASSWORD: praxis
      POSTGRES_DB: praxis
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - praxis_db_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praxis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  praxis_db_data:
