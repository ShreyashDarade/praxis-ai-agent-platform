[project]
name = "praxis"
version = "0.1.0"
description = "Autonomous capability-synthesizing agent platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.13",
    "slack-sdk>=3.33",
    "python-multipart>=0.0.9",
    # mcp 2.x renamed FastMCP -> MCPServer and changed other APIs;
    # MCPConnector and its test fixtures are written against the 1.x
    # API actually verified during development. Pin below 2.0 until a
    # deliberate migration, rather than letting an unbounded >= pull a
    # breaking major on the next fresh install.
    "mcp>=1.29,<2.0",
]

# Phase 3 (Ingestion & RAG) will need unstructured, pytesseract,
# pypdfium2, pandas, sentence-transformers, langchain-text-splitters,
# and pillow - deliberately not listed here yet. That draft attempt
# pulled in a globally-broken torch DLL on this machine (unrelated to
# Praxis's own code) that poisoned pytest's plugin autoload for every
# test in the repo, not just the ones that need it. Re-add these when
# Phase 3 is actually rebuilt, inside the isolated venv (see README /
# .venv), so a fresh torch install there is never contaminated by
# whatever else is on this machine's global Python.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.20",
    # slack_sdk's AsyncWebClient talks aiohttp, not httpx (respx can't
    # intercept it) - aioresponses mocks aiohttp the same way respx
    # mocks httpx, used only for SlackConnector's tests. aioresponses
    # 0.7.9 (latest as of writing) hasn't kept up with aiohttp's
    # ClientResponse internals past 3.10.x despite its own loose
    # aiohttp<4.0 constraint - pin aiohttp down to a version actually
    # compatible with the aioresponses version pip resolves, verified
    # against this pairing, not assumed.
    "aioresponses>=0.7",
    "aiohttp<3.11",
    # Async SQLite driver for SQLAlchemy's async engine - lets
    # SQLConnector's tests prove dialect-agnosticism against a real,
    # genuinely different dialect than Postgres, with zero external
    # service required.
    "aiosqlite>=0.20",
]

[project.scripts]
praxis = "praxis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
