[project]
name = "praxis"
version = "0.1.0"
description = "Autonomous capability-synthesizing agent platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.13",
    "slack-sdk>=3.33",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.20",
    # slack_sdk's AsyncWebClient talks aiohttp, not httpx (respx can't
    # intercept it) - aioresponses mocks aiohttp the same way respx
    # mocks httpx, used only for SlackConnector's tests.
    "aioresponses>=0.7",
]

[project.scripts]
praxis = "praxis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
