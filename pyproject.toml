[project]
name = "praxis"
version = "0.1.0"
description = "Autonomous capability-synthesizing agent platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.13",
    "slack-sdk>=3.33",
    "python-multipart>=0.0.9",
    # mcp 2.x renamed FastMCP -> MCPServer and changed other APIs;
    # MCPConnector and its test fixtures are written against the 1.x
    # API actually verified during development. Pin below 2.0 until a
    # deliberate migration, rather than letting an unbounded >= pull a
    # breaking major on the next fresh install.
    "mcp>=1.29,<2.0",
    # Phase 3 (Ingestion & RAG, spec §5). Each pin below is the version
    # actually resolved and verified working together inside this
    # project's isolated .venv (never the global Python - see the
    # torch-poisoning note this replaced), not a bare unbounded ">=".
    # `sentence-transformers` pulls in `torch` transitively - expected
    # and fine here since it's contained to this clean venv.
    "unstructured[pdf,docx]>=0.27,<0.28",
    "pytesseract>=0.3.13,<0.4",
    "pypdfium2>=5.13,<6.0",
    "pandas>=3.0,<4.0",
    "sentence-transformers>=6.0,<7.0",
    "langchain-text-splitters>=1.1,<2.0",
    "pillow>=12.3,<13.0",
    "openpyxl>=3.1,<4.0",
]

# Windows-only caveat, discovered and fixed while verifying this exact
# venv (not a bug in Praxis's own code): `unstructured` unconditionally
# requires `python-magic` (no extra gates it - confirmed via its own
# METADATA), and `python-magic`'s ctypes binding to a system `libmagic`
# DLL segfaults merely on `import magic` on this machine (Windows has no
# native libmagic) - which crashes the whole process the instant
# anything imports `unstructured.partition.auto` (it does
# `importlib.import_module("magic")` at its own module level, inside a
# try/except that catches ImportError but can't catch a native SIGSEGV).
# Fix verified directly: `pip uninstall -y python-magic` and leave it
# uninstalled - `unstructured`'s own fallback (the pure-Python `filetype`
# package, already a transitive dependency) then takes over cleanly and
# partition() works correctly (verified against real HTML). This can't
# be expressed as a pyproject.toml pin (python-magic works fine, and is
# preferable, on Linux/macOS - excluding it there would be a regression,
# not a fix) - after `pip install -e .`/`pip install .` on Windows, run:
#   .venv/Scripts/python.exe -m pip uninstall -y python-magic
# Separately: `unstructured`'s own METADATA also restricts
# `unstructured-inference` (real PDF layout-model partitioning) to
# platform_system != 'Windows' (or Windows + Python 3.12 only) - so real
# PDF partitioning via unstructured-inference is unavailable on this
# Windows + Python 3.11 dev machine by unstructured's own upstream
# design, not a Praxis bug. HTML/DOCX partitioning (and PDF on any other
# supported platform) are unaffected.

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "respx>=0.20",
    # slack_sdk's AsyncWebClient talks aiohttp, not httpx (respx can't
    # intercept it) - aioresponses mocks aiohttp the same way respx
    # mocks httpx, used only for SlackConnector's tests. aioresponses
    # 0.7.9 (latest as of writing) hasn't kept up with aiohttp's
    # ClientResponse internals past 3.10.x despite its own loose
    # aiohttp<4.0 constraint - pin aiohttp down to a version actually
    # compatible with the aioresponses version pip resolves, verified
    # against this pairing, not assumed.
    "aioresponses>=0.7",
    "aiohttp<3.11",
    # Async SQLite driver for SQLAlchemy's async engine - lets
    # SQLConnector's tests prove dialect-agnosticism against a real,
    # genuinely different dialect than Postgres, with zero external
    # service required.
    "aiosqlite>=0.20",
]

[project.scripts]
praxis = "praxis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
